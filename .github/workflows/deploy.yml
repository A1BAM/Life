name: Deploy

# Push to main -> live. Pull requests are built and the Worker bundle is
# validated, but nothing is deployed from a PR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build${{ github.event_name == 'push' && ' and deploy' || ' and validate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix web ci

      - name: Build SPA
        run: npm --prefix web run build

      # Catches config errors, bad bindings, and anything that fails to bundle
      # for workerd. Needs no Cloudflare credentials, so it also runs on PRs.
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Deploy
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The SPA is already built above; don't rebuild inside the action.
          command: deploy
